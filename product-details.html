<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="icon" type="image/jpeg" href="productsimages/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/site_selector.js"></script>
    <script src="js/site_content.js"></script>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo" data-nav-products>
                <img src="productsimages/logo.jpg" alt="Logo" loading="eager">
            </a>

            <nav class="nav-desktop">
                <a href="index.html" data-nav-products class="nav-link">Products</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="refund-policy.html" class="nav-link">Refund Policy</a>
                <a href="refund-form.html" class="nav-link">Refund Form</a>
            </nav>

            <button class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="index.html" data-nav-products>Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="refund-policy.html">Refund Policy</a>
        <a href="refund-form.html">Refund Form</a>
    </nav>

    <main id="home">
        <section class="hero" style="padding-bottom: 40px;">
            <div class="container hero-inner" style="grid-template-columns: 1fr;">
                <div class="hero-content" style="max-width: 820px;">
                    <div class="hero-badge" id="details-badge">PRODUCT</div>
                    <h1 class="hero-title" id="details-title">Product Details</h1>
                    <p class="hero-desc" id="details-short"></p>
                </div>
            </div>
        </section>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <div id="details-error" class="owner-hidden" style="padding:14px;border:1px solid rgba(220,38,38,0.35);background:rgba(220,38,38,0.06);border-radius:16px;"></div>

                <div id="details-grid" class="checkout-grid" style="margin-top: 0;">
                    <div style="background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);">
                        <div id="details-slider" style="display:flex;gap:12px;overflow:auto;scroll-snap-type:x mandatory;border-radius:14px;"></div>
                        <div id="details-thumbs" style="display:flex;gap:10px;overflow:auto;margin-top:12px;"></div>
                    </div>

                    <div style="background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);">
                        <div style="font-weight:800;margin-bottom:10px;">Description</div>
                        <div id="details-long" style="color:var(--muted);line-height:1.7;">—</div>

                        <div id="details-specs-wrap" style="margin-top:18px;"></div>

                        <div id="details-store-actions" style="margin-top:18px;">
                            <div style="border:1px solid var(--border);border-radius:14px;padding:12px;background:#fff;margin-bottom:12px;">
                                <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;">
                                    <div style="color:var(--muted);font-size:12px;">Price Summary</div>
                                    <div id="details-price-total" style="font-weight:900;color:var(--primary);"></div>
                                </div>
                                <div style="margin-top:8px;display:grid;gap:6px;">
                                    <div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:var(--muted);font-size:13px;">Unit price</span><span id="details-price-unit" style="font-weight:800;"></span></div>
                                    <div style="display:flex;justify-content:space-between;gap:12px;"><span style="color:var(--muted);font-size:13px;">Shipping (per unit)</span><span id="details-price-shipping" style="font-weight:800;"></span></div>
                                </div>
                            </div>
                            <div class="form-group" style="margin-bottom:12px;">
                                <label for="details-package">Package</label>
                                <select id="details-package"></select>
                            </div>
                            <div class="form-group" style="margin-bottom:12px;">
                                <label for="details-qty">Quantity</label>
                                <input id="details-qty" type="number" min="1" value="1">
                            </div>
                            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                                <button type="button" class="btn btn-outline" id="details-add-cart" style="flex:1 1 220px;">Add to Cart</button>
                                <button type="button" class="btn btn-primary" id="details-checkout" style="flex:1 1 220px;">Buy Now</button>
                            </div>
                        </div>

                        <div id="details-affiliate-actions" class="owner-hidden" style="margin-top:18px;">
                            <div id="details-affiliate-price" style="font-weight:900;color:var(--primary);font-size:1.25rem;margin-bottom:12px;"></div>
                            <a class="btn btn-primary" id="details-affiliate-cta" href="#" target="_blank" rel="noopener noreferrer" style="width:100%;display:inline-flex;justify-content:center;">Visit Vendor</a>
                        </div>

                        <div style="margin-top:16px;">
                            <a href="index.html" data-nav-products class="btn btn-outline" style="width:100%;display:inline-flex;justify-content:center;">Back to products</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/cart.js"></script>
    <script src="js/product_details.js"></script>
</body>
</html>
