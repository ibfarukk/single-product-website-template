<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Request</title>
    <link rel="icon" type="image/jpeg" href="productsimages/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/site_selector.js"></script>
    <script src="js/site_content.js"></script>
</head>
<body data-page="refund-form">
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <img src="productsimages/logo.jpg" alt="Logo" loading="eager">
            </a>

            <nav class="nav-desktop">
                <a href="index.html" data-nav-products class="nav-link">Products</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="contact.html" class="nav-link">Contact</a>
                <a href="refund-policy.html" class="nav-link">Refund Policy</a>
                <a href="refund-form.html" class="nav-link">Refund Form</a>
            </nav>

            <button class="mobile-menu-btn" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <nav class="mobile-nav">
        <a href="index.html" data-nav-products>Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="refund-policy.html">Refund Policy</a>
        <a href="refund-form.html">Refund Form</a>
    </nav>

    <main id="home">
        <section class="hero" style="padding-bottom: 40px;">
            <div class="container hero-inner" style="grid-template-columns: 1fr;">
                <div class="hero-content" style="max-width: 820px;">
                    <div class="hero-badge" id="page-badge">PMELAB</div>
                    <h1 class="hero-title" id="page-title">Refund Request</h1>
                    <p class="hero-desc" id="page-subtitle"></p>
                </div>
            </div>
        </section>

        <section class="section" style="padding-top: 0;">
            <div class="container">
                <div class="checkout-grid" style="margin-top:0;">
                    <div style="border:1px solid var(--border);border-radius:16px;padding:18px;background:#fff;box-shadow:var(--shadow-sm);">
                        <div id="page-content"></div>
                        <div id="refund-result" class="owner-hidden" style="margin-top:14px;padding:12px;border-radius:14px;"></div>
                    </div>
                    <form id="refund-form" style="border:1px solid var(--border);border-radius:16px;padding:18px;background:#fff;box-shadow:var(--shadow-sm);">
                        <div class="form-group">
                            <label for="refund-name">Full Name</label>
                            <input id="refund-name" type="text" required>
                        </div>
                        <div class="form-group">
                            <label for="refund-email">Email</label>
                            <input id="refund-email" type="email" required>
                        </div>
                        <div class="form-group">
                            <label for="refund-phone">Phone</label>
                            <input id="refund-phone" type="tel" required>
                        </div>
                        <div class="form-group">
                            <label for="refund-reference">Order Reference</label>
                            <input id="refund-reference" type="text" required>
                        </div>
                        <div class="form-group">
                            <label for="refund-message">Refund Details</label>
                            <textarea id="refund-message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;">SUBMIT REFUND REQUEST</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="js/info_pages.js"></script>
</body>
</html>
