<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | PMELAB TECHNOLOGY LIMITED</title>
    <meta name="description" content="Your payment was not completed. Please try again or choose another payment method.">
    <link rel="icon" type="image/jpeg" href="productsimages/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .failed-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(180deg, #FEF2F2 0%, var(--background) 100%);
        }
        .failed-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 48px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
        }
        .failed-icon {
            width: 80px;
            height: 80px;
            background: #FEE2E2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .failed-icon svg {
            width: 40px;
            height: 40px;
            color: #DC2626;
        }
        .failed-card h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: var(--text);
        }
        .failed-card > p {
            color: var(--muted);
            margin-bottom: 32px;
            font-size: 1rem;
        }
        .failed-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .failed-buttons .btn {
            width: 100%;
            justify-content: center;
        }
        .failed-status {
            display: none;
            margin: 0 0 20px;
            padding: 14px 16px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .failed-status.active {
            display: block;
        }
        @media (max-width: 480px) {
            .failed-card {
                padding: 32px 24px;
            }
            .failed-card h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="failed-page">
        <div class="failed-card">
            <div class="failed-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <h1>PAYMENT NOT COMPLETED</h1>
            <p>Your payment was not completed. This could be due to a network issue, insufficient funds, or cancellation. You can try again or choose another payment method.</p>
            <div class="failed-status" id="payment-recheck-status"></div>

            <div class="failed-buttons">
                <a href="index.html#checkout" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                    TRY AGAIN
                </a>
                <a href="#" class="btn btn-whatsapp" id="whatsapp-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    ORDER VIA WHATSAPP
                </a>
                <a href="index.html" class="btn btn-outline">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    BACK TO STORE
                </a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/whatsapp.js"></script>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const reference = String(params.get('ref') || '').trim();
            const statusBox = document.getElementById('payment-recheck-status');

            function getApiUrl(path) {
                const cleanPath = path.startsWith('/') ? path : '/' + path;
                const base = typeof API_BASE_URL !== 'undefined' ? String(API_BASE_URL).trim() : '';
                if (!base) return cleanPath;
                return base.replace(/\/+$/, '') + cleanPath;
            }

            function setStatus(message) {
                if (!statusBox) return;
                statusBox.textContent = message;
                statusBox.classList.add('active');
            }

            if (!reference) return;

            let attempts = 0;
            const maxAttempts = 6;

            function checkStatus() {
                attempts += 1;
                setStatus('We are rechecking your payment confirmation. Please wait...');

                fetch(getApiUrl('/api/payment-status?ref=' + encodeURIComponent(reference)))
                    .then(function(res) {
                        return res.json().catch(function() {
                            return { success: false, retryable: true };
                        });
                    })
                    .then(function(data) {
                        const record = data && data.record ? data.record : null;
                        if (data.success && record && record.paymentStatus === 'verified') {
                            const pkg = record.packageId || params.get('pkg') || 'single';
                            window.location.replace('success.html?ref=' + encodeURIComponent(reference) + '&pkg=' + encodeURIComponent(pkg));
                            return;
                        }

                        if (attempts < maxAttempts && (!data || data.retryable !== false)) {
                            window.setTimeout(checkStatus, 2000);
                            return;
                        }

                        setStatus('We could not confirm this payment automatically yet. If you already paid successfully, please wait a moment and try again.');
                    })
                    .catch(function() {
                        if (attempts < maxAttempts) {
                            window.setTimeout(checkStatus, 2000);
                            return;
                        }
                        setStatus('We could not confirm this payment automatically yet. If you already paid successfully, please wait a moment and try again.');
                    });
            }

            window.setTimeout(checkStatus, 800);
        })();
    </script>
</body>
</html>
